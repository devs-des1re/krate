name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      npm_config_frozen_lockfile: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Determine npm dist-tag
        id: tag
        shell: bash
        run: |
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" == *"-"* ]]; then
            # Takes everything after the first '-' and strips trailing dots/numbers
            PRERELEASE_STR="${VERSION#*-}"
            TAG_NAME="${PRERELEASE_STR%%.*}"
            echo "dist_tag=${TAG_NAME:-beta}" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
            else
            echo "dist_tag=latest" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
            fi

      - name: Sync package versions
        run: node scripts/set-version.mjs "${GITHUB_REF_NAME#v}"

      - name: Install JS dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build JS packages
        run: pnpm -r --filter "!@krate/web" --filter "!@krate/benchmark" build

      - name: Generate platform packages
        run: node scripts/build-platform-packages.mjs

      - name: Publish platform packages
        run: |
          set -e
          for pkg in core-win32-x64 core-win32-arm64 core-linux-x64 core-linux-x64-musl core-linux-arm64 core-darwin-x64 core-darwin-arm64; do
            echo "Publishing @krate/$pkg with tag ${{ steps.tag.outputs.dist_tag }}..."
            (cd "dist-platform/$pkg" && pnpm publish --access public --no-git-checks --tag "${{ steps.tag.outputs.dist_tag }}")
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish npm packages
        run: |
          set -e
          for dir in packages/runtime packages/components packages/core packages/create-krate-app packages/create-krate-docs; do
            echo "Publishing $(basename "$dir") with tag ${{ steps.tag.outputs.dist_tag }}..."
            (cd "$dir" && pnpm publish --access public --no-git-checks --tag "${{ steps.tag.outputs.dist_tag }}")
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Compute compiler SDK changelog
        id: sdk
        shell: bash
        run: |
          set -e
          VERSION="v${GITHUB_REF_NAME#v}"
          PREV="$(
            git tag -l 'packages/compiler/v*' \
              | grep -v -F -- "packages/compiler/${VERSION}" \
              | sort -V \
              | tail -n 1 || true
          )"
          if [ -n "${PREV}" ]; then
            echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
            COMMITS="$(git log --format='- %s' "${PREV}..HEAD" -- packages/compiler || true)"
          else
            echo "prev=NONE" >> "$GITHUB_OUTPUT"
            COMMITS="$(git log --format='- %s' HEAD -- packages/compiler || true)"
          fi
          if [ -z "${COMMITS}" ]; then
            COMMITS="- No changes in this release."
          fi
          printf '## Compiler SDK released %s\n\n' "${VERSION}" > compiler-sdk-notes.md
          MAJOR="$(echo "${VERSION}" | cut -d. -f1 | sed 's/v//')"
          MODULE_PATH="github.com/kratejs/krate/packages/compiler"
          if [ "${MAJOR}" -gt 1 ]; then
            MODULE_PATH="${MODULE_PATH}/v${MAJOR}"
          fi
          printf 'The Go module `%s` is published at tag `packages/compiler/%s`.\n\n' "${MODULE_PATH}" "${VERSION}" >> compiler-sdk-notes.md
          printf '```sh\ngo get %s@%s\n```\n\n' "${MODULE_PATH}" "${VERSION}" >> compiler-sdk-notes.md
          printf '### Changelog\n\n%s\n\n---\n\n' "${COMMITS}" >> compiler-sdk-notes.md

      - name: Tag Go module
        shell: bash
        run: |
          set -e
          VERSION="v${GITHUB_REF_NAME#v}"
          GO_TAG="packages/compiler/${VERSION}"
          if git rev-parse -q --verify "refs/tags/${GO_TAG}" >/dev/null; then
            echo "tag ${GO_TAG} already exists; skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${GO_TAG}" "${GITHUB_SHA}"
            git push origin "${GO_TAG}"
            echo "pushed ${GO_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists; skipping"
            exit 0
          fi
          NOTES="$(mktemp)"
          cat compiler-sdk-notes.md > "${NOTES}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=${GITHUB_REF_NAME}" \
            --jq .body >> "${NOTES}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Krate ${GITHUB_REF_NAME}" \
            --prerelease=${{ steps.tag.outputs.prerelease }} \
            --notes-file "${NOTES}"